notes:
  - "Target version is 4.0.9 (latest 4.0.x patch) because user steering mandates 'Spring Boot 4.0 exactly'; this overrides the skill default of 4.1.0."
  - "java.version / maven.compiler.release remain 25 (unchanged, never downgraded). Build JDK is Corretto 25.0.5."
  - "Stale Boot-3 BOM overrides <tomcat.version>10.1.59</tomcat.version> and <jackson-bom.version>2.21.7</jackson-bom.version> were deleted so the Boot 4.0.9 BOM manages Tomcat 11.0.27 and Jackson 3.1.7; both confirmed free of known CVEs."
  - "No source file changes were required: the project has no Jackson, Spring Security, Spring Cloud/Batch/Kafka/AMQP/AI/gRPC/Jersey/native-AOT usage, no javax.* EE imports, no actuator-autoconfigure imports, no @MockBean/@SpyBean, and no application.properties/yml."
  - "springboot4-observability made no changes: the only observability coordinate present is spring-boot-starter-actuator (kept); no micrometer-tracing-bridge-*, opentelemetry-exporter-*, zipkin-reporter-* dependency, no management.otlp.* properties and no @Observed/@Timed usage."
  - "Test counting is Spock-aware: DownloadControllerTest.groovy declares 12 Spock feature methods (class DownloadControllerSpec), which the stock @Test-family regex records as 0; the baseline and the integrity comparison both use the Spock feature-method pattern."

manual_review_needed:
  - "Actuator endpoint exposure defaults differ between Boot 3 and Boot 4 - smoke-test /actuator/health in a staging environment."
  - "DownloadController binds @RequestHeader(IF_MODIFIED_SINCE) as Optional<java.util.Date> and ExistingFile converts via Date::toInstant. This still works on Boot 4 / Spring 7 but java.time would be the modern choice; left unchanged as it is out of migration scope."
